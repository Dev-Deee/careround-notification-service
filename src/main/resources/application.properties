spring.application.name=careround-notification-service

server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/careround_notification_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.public-key=${JWT_PUBLIC_KEY}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# used by the dead-letter publisher (KafkaErrorHandlingConfig)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

grpc.client.auth-service.address=static://localhost:9095
grpc.client.auth-service.negotiationType=plaintext

grpc.client.patient-service.address=static://localhost:9090
grpc.client.patient-service.negotiationType=plaintext

app.grpc.deadline-ms=5000

# Redis pub/sub (same container as auth-service: careround-redis). Short timeout: a slow Redis must not
# hold the Kafka listener thread; a failed publish is recovered by the replay endpoint.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
app.alerts.redis-channel=careround.alerts
